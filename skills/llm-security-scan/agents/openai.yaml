# OpenAI/Codex-specific metadata for this skill.
# Optional per learn.chatgpt.com/docs/build-skills; ignored by Claude Code and
# Gemini CLI, which read only SKILL.md. Keeping it inside the skill directory is
# what makes the ONE canonical skill natively Codex-ready with no fork.
interface:
  display_name: LLM Security Scan
  short_description: OWASP Top 10 for LLMs scanning of systems you operate.
  long_description: >-
    Runs the llm-security-scanner CLI against an LLM-backed application you own —
    chatbot, LLM API, RAG pipeline, tool-using agent, MCP server, or a local Ollama
    model — using a local Ollama model as the judge. Maps the attack surface first,
    enforces an authorization gate, then interprets findings by evidence class and
    helps remediate and re-verify them. Fully offline apart from the target itself.
  default_prompt: >-
    Inspect this project's LLM attack surface, tell me which OWASP LLM categories
    apply and why, and propose a scan configuration. Do not scan anything yet.

policy:
  # Implicit activation is on: the skill should engage when a task is clearly about
  # LLM security testing. The authorization gate inside the scripts — not activation
  # policy — is what prevents an unauthorized scan, so gating activation would only
  # make the skill less discoverable without adding safety.
  allow_implicit_invocation: true

dependencies:
  tools:
    # Optional. The skill works through shell commands alone; the MCP server exists
    # for hosts that cannot run one. See references/mcp.md.
    - type: mcp
      name: llm-security-scanner
      command: llm-scanner-skill
      args: ["mcp"]
      optional: true
