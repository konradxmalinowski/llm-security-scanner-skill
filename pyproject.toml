[project]
name = "llm-security-scanner-skill"
version = "0.1.0"
description = "Cross-platform AI agent skill for llm-security-scanner - OWASP Top 10 for LLMs scanning from Claude, Gemini, Codex and MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Konrad Malinowski" }]
keywords = [
    "agent-skills",
    "ai-agents",
    "claude",
    "gemini",
    "llm-security",
    "mcp",
    "owasp",
    "prompt-injection",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    # The scanner itself. This package is an adapter over its CLI and never
    # reimplements the engine, so the engine is a hard dependency.
    "llm-security-scanner>=0.8.0,<1.0",
    "pydantic>=2.13.4",
    "PyYAML>=6.0.3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# MCP is optional: the skill works on Claude Code, Gemini CLI and Codex through
# shell commands alone. MCP is for agents that cannot run a shell.
mcp = ["mcp>=2.3.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
    "mcp>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/konradxmalinowski/llm-security-scanner-skill"
Repository = "https://github.com/konradxmalinowski/llm-security-scanner-skill"
Issues = "https://github.com/konradxmalinowski/llm-security-scanner-skill/issues"
Scanner = "https://github.com/konradxmalinowski/llm-security-scanner"

[project.scripts]
llm-scanner-skill = "llm_scanner_skill.cli:entrypoint"
llm-scanner-skill-mcp = "llm_scanner_skill.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_scanner_skill"]

# The canonical skill directory ships inside the wheel so `llm-scanner-skill
# install` works from a pip install, not only from a git checkout.
[tool.hatch.build.targets.wheel.force-include]
"skills/llm-security-scan" = "llm_scanner_skill/skill_bundle/llm-security-scan"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/platforms",
    "/commands",
    "/tests",
    "/docs",
    "/examples",
    "/.claude-plugin",
    "/gemini-extension.json",
    "/AGENTS.md",
    "/GEMINI.md",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "S",    # flake8-bandit - a security tool self-enforces these
    "I",    # isort
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert - used in tests and in narrow invariant checks
    "E501",  # line length - handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately embed fake credentials and injection strings as fixtures.
"tests/**" = ["S101", "S105", "S106", "S108"]
# The adapter's whole job is to run a subprocess; argv is built in-process and
# never passed through a shell.
"src/llm_scanner_skill/adapter.py" = ["S404", "S603"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
