name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A fine-grained PAT, not the default GITHUB_TOKEN, specifically so the tag
          # release-please creates DOES trigger release.yml. Same arrangement as the
          # scanner repo. Scope it to Contents + Pull requests on this repo only.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
