name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Skipped until RELEASE_PLEASE_TOKEN exists, so a fresh clone or fork is not
    # permanently red over a secret it was never given. See CONTRIBUTING.md for the
    # one-time setup. A secret cannot be referenced in a job-level `if`, so the
    # presence check is a step.
    steps:
      - name: Check for the release-please token
        id: check
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RELEASE_PLEASE_TOKEN is not set; skipping release automation." \
                 "Add a fine-grained PAT (Contents + Pull requests, read/write on this repo)" \
                 "to enable it. See CONTRIBUTING.md."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: googleapis/release-please-action@v5
        if: steps.check.outputs.present == 'true'
        id: release
        with:
          # A fine-grained PAT, not the default GITHUB_TOKEN, specifically so the tag
          # release-please creates DOES trigger release.yml. Same arrangement as the
          # scanner repo. Scope it to Contents + Pull requests on this repo only.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
