# gitleaks configuration.
#
# This repository documents credential FORMATS -- the sanitizer's regexes, and the
# test fixtures that prove they fire. Those are deliberate non-secrets, so they are
# allowlisted by path rather than by weakening the rules themselves.

[extend]
useDefault = true

[[allowlist]]
description = "Sanitizer secret-detection patterns (regex source, not credentials)"
paths = ['''src/llm_scanner_skill/sanitize\.py''']

[[allowlist]]
description = "Test fixtures that assert the secret detectors fire"
paths = ['''tests/test_sanitize\.py''', '''tests/test_summarize\.py''', '''tests/conftest\.py''']

[[allowlist]]
description = "Documented example credential shapes in reference material"
paths = ['''skills/llm-security-scan/references/.*\.md''', '''docs/.*\.md''']

[[allowlist]]
description = "Canonical AWS documentation example key"
regexes = ['''AKIAIOSFODNN7EXAMPLE''']
